title: "Learning by Doing"
deck: "Our program uses Work-Integrated Learning (WIL). WIL connects students with industry professionals. It includes portfolio reviews, guest speakers, studio tours, networking events, and Fieldwork."
desc: "<p>Our program uses Work-Integrated Learning (WIL). WIL connects students with industry professionals. It includes portfolio reviews, guest speakers, studio tours, networking events, and Fieldwork.</p>
<p>
To prepare for Fieldwork, mentors coach students to prepare their personal brand, present a portfolio, to market themselves as strong candidates for industry positions. Fieldwork is a six-week internship during which students will work under professional designers on real client projects.
</p>
